<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BreadSMP - Minecraft Server Indonesia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

/* 🔥 BACKGROUND MOTIF */
body{
  background:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.02) 0,
      rgba(255,255,255,.02) 1px,
      transparent 1px,
      transparent 14px
    ),
    radial-gradient(circle at 15% 10%,#2563eb66,transparent 40%),
    radial-gradient(circle at 85% 30%,#7c3aed66,transparent 45%),
    linear-gradient(180deg,#020617,#020b2d);
  color:#fff;
  overflow-x:hidden;
}

/* ⭐ PARTICLE */
.star{
  position:fixed;
  width:2px;height:2px;
  background:#93c5fd;
  border-radius:50%;
  animation:float 7s linear infinite;
  opacity:.6;
}
@keyframes float{
  from{transform:translateY(110vh)}
  to{transform:translateY(-10vh)}
}

/* HEADER */
header{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 20px;
}

header img{
  width:160px;
  margin-bottom:20px;
  filter:drop-shadow(0 15px 40px rgba(56,189,248,.6));
}

.logo-text{
  font-size:3.3rem;
  font-weight:900;
  background:linear-gradient(270deg,#38bdf8,#a855f7,#22c55e);
  background-size:600% 600%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradientMove 6s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0%}
  50%{background-position:100%}
  100%{background-position:0%}
}

header p{
  max-width:520px;
  margin:14px auto;
  color:#c7d2fe;
}

.divider{
  width:90px;height:4px;
  background:linear-gradient(90deg,#38bdf8,transparent);
  margin:26px auto;border-radius:10px;
}

.btn{
  display:inline-block;
  margin:8px;
  padding:14px 30px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  border-radius:18px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 12px 30px rgba(56,189,248,.45);
  transition:.3s;
}
.btn:hover{transform:translateY(-4px) scale(1.05)}

section{
  padding:90px 20px;
  max-width:1200px;
  margin:auto;
}

/* CARD */
.card{
  background:linear-gradient(180deg,#020617,#020b2d);
  border:1px solid #1e40af;
  padding:30px;
  border-radius:26px;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}

/* PLAYER ONLINE */
#server-box{
  max-width:520px;
  margin:35px auto 0;
  border:1px solid #38bdf8;
  box-shadow:0 0 40px rgba(56,189,248,.35);
}

.player-list{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 14px;
  background:#020617;
  border:1px solid #1e3a8a;
  border-radius:999px;
  font-size:.9rem;
}

.player img{
  width:30px;height:30px;border-radius:8px;
}

footer{
  text-align:center;
  padding:26px;
  background:#020617;
  border-top:1px solid #1e3a8a;
  color:#94a3b8;
  font-size:.9rem;
}

@media(max-width:600px){
  .logo-text{font-size:2.3rem}
  header img{width:130px}
}
</style>
</head>

<body>

<script>
for(let i=0;i<70;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=4+Math.random()*6+"s";
  document.body.appendChild(s);
}
</script>

<header>
<div data-aos="zoom-in">
<img src="logo.png" alt="BreadSMP Logo">
<h1 class="logo-text">BreadSMP</h1>
<p>Server SMP Indonesia dengan fitur lengkap dan komunitas aktif.</p>

<div class="divider"></div>

<a class="btn" href="#">Discord</a>
<a class="btn" href="#">WhatsApp</a>
<a class="btn" href="#">Vote</a>

<div id="server-box" class="card" style="display:none">
<h3 id="status">🎮 Player Online</h3>
<p id="ip" style="color:#a5f3fc"></p>
<p id="count"></p>
<div id="players" class="player-list"></div>
</div>
</div>
</header>

<footer>
© 2023 BreadSMP • Community Driven Minecraft Server
</footer>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({duration:900,once:true});

const API="https://api.mcsrvstat.us/3/play.breadsmp.my.id:55555";
const box=document.getElementById("server-box");
const status=document.getElementById("status");
const ip=document.getElementById("ip");
const count=document.getElementById("count");
const players=document.getElementById("players");

function load(){
fetch(API).then(r=>r.json()).then(d=>{
box.style.display="block";

if(!d.online){
status.innerHTML="🔴 Server Offline";
players.innerHTML="";
return;
}

status.innerHTML="🎮 Player Online";
ip.innerHTML="🌐 IP: <b>play.breadsmp.my.id</b> • PORT: <b>55555</b>";
count.innerHTML=`👥 Player: <b>${d.players.online}</b> / <b>${d.players.max}</b>`;
players.innerHTML="";

(d.players.list||[]).forEach(p=>{
const name = typeof p==="string" ? p : p.name || p.username;
if(!name) return;

players.innerHTML+=`
<div class="player">
<img src="https://mc-heads.net/avatar/${name}/64">
${name}
</div>`;
});
});
}
load();
setInterval(load,5000);
</script>

</body>
</html>
